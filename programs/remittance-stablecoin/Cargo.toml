[package]
name = "remittance-stablecoin"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "remittance_stablecoin"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.1.2"
bytemuck = "1.25.0"
spl-token-2022-interface = "2.1.0"
spl-token-confidential-transfer-proof-extraction = "0.5.1"
spl-token-metadata-interface = "0.8.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-account = "3.4.0"
solana-compute-budget = "3.1.14"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-sdk-ids = "3.1.0"
solana-zk-elgamal-proof-program = "3.1.14"
spl-associated-token-account-interface = "2.0.0"
spl-token-confidential-transfer-proof-generation = "0.5.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
